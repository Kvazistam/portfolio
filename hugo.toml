baseURL = 'https://твой-ник.github.io/'
languageCode = 'ru-ru'
title = 'Портфолио | Твое Имя'
theme = 'paper'

# Меню навигации
[menu]
  [[menu.main]]
    identifier = "courses"
    name = "Курсы"
    url = "/courses/"
    weight = 10
  [[menu.main]]
    identifier = "about"
    name = "Обо мне"
    url = "/about/"
    weight = 20

# Параметры темы Paper
[params]
  # Обязательно: имя автора (строка)
  author = "Твое Имя"
  
  description = "Мое портфолио и учебные проекты"
  keywords = "portfolio, hugo, github-pages"
  images = ["images/og-image.png"] # Опционально: для соцсетей
  
  # Настройки домашней страницы
  [params.homeInfoParams]
    Title = "Привет 👋"
    Content = "Добро пожаловать в мое портфолио. Здесь я собираю свои учебные проекты."

  # Социальные ссылки (иконки появятся в футере)
  [params.social]
    GitHub = "https://github.com/твой-ник"
    Telegram = "https://t.me/твой-ник"
    Email = "mailto:tvoya@pochta.com"

  # Настройки темы (светлая/темная)
  # defaultTheme = "light" # или "dark", или "auto"
  
  # Показывать метаданные (дата, время чтения)
  ShowReadingTime = true
  ShowShareButtons = true
  ShowCodeCopyButtons = true